services:
  litman-analysis:
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    build:
      context: .
      args:
        CODEX_VERSION: 0.156.1
    environment:
      HOME: /tmp/litman-analysis/home
      CODEX_HOME: /var/lib/litman-analysis/codex
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
      LITMAN_ANALYSIS_RUNS_DIR: /data/runs
      LITMAN_ANALYSIS_WORKSPACE_DIR: /tmp/litman-analysis/workspaces
      LITMAN_ANALYSIS_INPUT_DIR: /input
      LITMAN_ANALYSIS_OUTPUT_DIR: /output
      LITMAN_ANALYSIS_MAX_FILE_MB: ${LITMAN_ANALYSIS_MAX_FILE_MB:-25}
      LITMAN_ANALYSIS_CODEX_AUTH_MODE: ${LITMAN_ANALYSIS_CODEX_AUTH_MODE:-chatgpt}
      LITMAN_ANALYSIS_CODEX_API_KEY_FILE: ${LITMAN_ANALYSIS_CODEX_API_KEY_FILE:-}
      LITMAN_ANALYSIS_CODEX_MODEL: ${LITMAN_ANALYSIS_CODEX_MODEL:-gpt-5.5}
      LITMAN_ANALYSIS_CODEX_TIMEOUT_SECONDS: ${LITMAN_ANALYSIS_CODEX_TIMEOUT_SECONDS:-1800}
      LITMAN_ANALYSIS_CODEX_PREFLIGHT: ${LITMAN_ANALYSIS_CODEX_PREFLIGHT:-true}
      LITMAN_ANALYSIS_CODEX_PREFLIGHT_TIMEOUT_SECONDS: ${LITMAN_ANALYSIS_CODEX_PREFLIGHT_TIMEOUT_SECONDS:-120}
    volumes:
      - ${LITMAN_ANALYSIS_JOB_DIR:-./.local-state/mounts/job}:/job:ro
      - ${LITMAN_ANALYSIS_INPUT_DIR:-./local-data/input}:/input:ro
      - ${LITMAN_ANALYSIS_OUTPUT_DIR:-./local-data/output}:/output
      - ${LITMAN_ANALYSIS_RUNS_HOST_DIR:-./runs}:/data/runs
      - ${LITMAN_ANALYSIS_SECRETS_DIR:-./local-secrets}:/run/secrets:ro
      - ${LITMAN_ANALYSIS_CODEX_STATE_DIR:-./.local-state/codex}:/var/lib/litman-analysis/codex
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
