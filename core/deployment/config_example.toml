[job]
type = "detailed-analysis"
# id = "licitacion-ayuntamiento-2026"  # opcional: por defecto, el nombre de la carpeta de entrada (o el id de carpeta de Drive).

[input]
location = "./input"
# kind = "local"  # opcional: "local" (predeterminado) o "google-drive".

[output]
directory = "./runs"
# google_drive_folder_id = "DESTINATION_FOLDER_ID"  # opcional: sin él no hay réplica en Drive.

# [llm]
# provider = "codex"  # opcional: "codex" (predeterminado, gpt-5.6-luna) o "claude-code" (claude-sonnet-5).
# model = "claude-sonnet-5"  # opcional: por defecto, el modelo predeterminado del proveedor.

# [publication]
# include_run_files = false  # opcional: publica también archivos fuera del catálogo de entregables.
