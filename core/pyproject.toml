[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "litman-core"
version = "0.4.0"
description = "Módulo de análisis de licitaciones de LitMan"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.0",
  "google-auth>=2.0",
  "jsonschema>=4.19",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
litman-core = "litman_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"litman_core.resources" = [
  "**/*.json", "**/*.yaml", "**/*.md", "**/VERSION", "**/*.docx", "**/*.xlsx",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
