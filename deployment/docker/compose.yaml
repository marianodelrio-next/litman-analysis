services:
  litman-core:
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        CODEX_VERSION: 0.156.1
    environment:
      HOME: /tmp/litman-core/home
      CODEX_HOME: /var/lib/litman-core/codex
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
      LITMAN_CORE_WORKSPACE_DIR: /tmp/litman-core/workspaces
      LITMAN_CORE_CODEX_AUTH_MODE: ${LITMAN_CORE_CODEX_AUTH_MODE:-chatgpt}
    volumes:
      - ../config.toml:/app/config.toml:ro
      - ../input:/app/input:ro
      - ../runs:/app/runs
      - ${LITMAN_CORE_SECRETS_DIR:-../local-secrets}:/run/secrets:ro
      - ${LITMAN_CORE_CODEX_STATE_DIR:-../local-secrets/codex}:/var/lib/litman-core/codex
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
