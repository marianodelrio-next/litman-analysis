[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "litman-harness"
version = "0.1.0"
description = "Local, user-authorized Drive harness for LitMan"
requires-python = ">=3.11"
dependencies = [
  "litman-core==0.1.0",
  "google-api-python-client>=2.0",
  "google-auth>=2.0",
  "google-auth-oauthlib>=1.0",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "python-docx>=1.1",
]

[tool.uv.sources]
litman-core = { path = "../core" }

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
litman = "litman_harness.interfaces.cli:main"
litman-mcp = "litman_harness.interfaces.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
